name: Deploy Project
on: push
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            - name: Install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install Dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Run tests
              run: npm test
            - name: Build the scripts
              run: npm run build
            - name: Simulate deployment
              run: echo "Simulating deployment..."